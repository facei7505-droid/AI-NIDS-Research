name: TTL shortcut decomposition (training only)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ttl-decomposition.yml'
permissions:
  contents: write
concurrency:
  group: ttl-decomposition
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check the research code
        run: python -m pytest -q
      - name: Retrieve SHA-256 pinned training data
        run: python src/download_data.py
      - name: Run training-only TTL sensitivity analysis
        run: python src/ttl_decomposition.py --train data/UNSW_NB15_training-set.csv --output results/ttl_decomposition.json
      - name: Validate full recorded design
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('results/ttl_decomposition.json').read_text())
          assert o['train_sha256']=='bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa'
          assert o['status']=='TRAINING_ONLY_POST_HOC_TTL_SENSITIVITY'
          assert len(o['results'])==3*2*2*5, len(o['results'])
          assert len(o['feature_groups']['ttl'])==3
          for r in o['results']:
              assert all(0<=r[k]<=1 for k in ['fpr','recall'])
              assert sum(r[k] for k in ['tn','fp','fn','tp'])==r['n']
          print('TTL decomposition evidence verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttl-decomposition-exploratory-evidence
          path: results/ttl_decomposition.json
          retention-days: 30
      - name: Commit only executed results
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/ttl_decomposition.json
          git commit -m "results: publish executed training-only TTL decomposition [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
