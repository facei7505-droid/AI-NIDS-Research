name: Matched TTL retraining ablation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ttl-retraining-ablation.yml'

permissions:
  contents: write

concurrency:
  group: ttl-retraining-ablation
  cancel-in-progress: false

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate research test suite
        run: python -m pytest -q
      - name: Download and SHA256-verify source data
        run: python src/download_data.py
      - name: Execute training-only matched TTL retraining study
        run: python src/ttl_retraining_ablation.py --train data/UNSW_NB15_training-set.csv --output results/ttl_retraining_ablation.json
      - name: Generate report from executed JSON
        run: python src/report_ttl_retraining.py --input results/ttl_retraining_ablation.json --output results/TTL_RETRAINING_REPORT.md
      - name: Verify evidence completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/ttl_retraining_ablation.json').read_text(encoding='utf-8'))
          assert d['status']=='TRAIN_ONLY_POST_HOC_RETRAINED_TTL_ABLATION'
          assert d['train_sha256']=='bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa'
          assert len(d['rows'])==3*2*2*4
          assert len(d['effect_summaries'])==3*2*2
          assert Path('results/TTL_RETRAINING_REPORT.md').is_file()
          for r in d['rows']:
              assert r['train_rows']+r['validation_rows']==175341
              assert sum(r[k] for k in ('tn','fp','fn','tp'))==r['validation_rows']
          print('Verified matched TTL retraining study')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ttl-retraining-evidence
          path: |
            results/ttl_retraining_ablation.json
            results/TTL_RETRAINING_REPORT.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified artifacts if changed
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/ttl_retraining_ablation.json results/TTL_RETRAINING_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "results: publish verified matched TTL study [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No changed evidence to publish"
          fi
