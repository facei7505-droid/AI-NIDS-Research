name: Matched TTL retraining ablation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ttl-retraining-ablation.yml'
permissions:
  contents: write
concurrency:
  group: ttl-retraining-ablation
  cancel-in-progress: false
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate complete research suite
        run: python -m pytest -q
      - name: Download and verify pinned UNSW-NB15 split CSVs
        run: python src/download_data.py
      - name: Execute train-only matched TTL retraining ablation
        run: |
          python src/ttl_retraining_ablation.py \
            --train data/UNSW_NB15_training-set.csv \
            --output results/ttl_retraining_ablation.json
      - name: Verify evidence counts and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/ttl_retraining_ablation.json').read_text())
          assert r["status"]=="TRAIN_ONLY_POST_HOC_RETRAINED_TTL_ABLATION"
          assert r["train_sha256"]=="bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa"
          assert len(r["rows"])==3*2*2*4
          assert len(r["effect_summaries"])==3*2*2
          for x in r["rows"]:
              assert x["train_rows"]+x["validation_rows"]==175341
              assert x["tn"]+x["fp"]+x["fn"]+x["tp"]==x["validation_rows"]
          print("Verified",len(r["rows"]),"measurements")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matched-ttl-retraining-study
          path: results/ttl_retraining_ablation.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish executed scientific evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/ttl_retraining_ablation.json
          git commit -m "results: publish executed matched TTL retraining study [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
