name: Class mixing falsification control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/class-mixing-control.yml'
permissions:
  contents: write
concurrency:
  group: class-mixing-control
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete test suite
        run: python -m pytest -q
      - name: Download and hash-verify corpus
        run: python src/download_data.py
      - name: Run class mixing diagnostic on training records ONLY
        run: |
          python src/class_mixing_control.py \
            --train data/UNSW_NB15_training-set.csv \
            --output results/class_mixing_control.json
      - name: Enforce evidence completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/class_mixing_control.json')
          o=json.loads(p.read_text())
          assert o['status']=='TRAIN_ONLY_POST_HOC_CLASS_MIXING_CONTROL'
          assert o['train_sha256']=='bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa'
          assert len(o['rows'])==3*2*7, len(o['rows'])
          assert len(o['interactions'])==3*2*2, len(o['interactions'])
          for x in o['rows']:
              assert x['tn']+x['fp']+x['fn']+x['tp']==x['n']
              assert 0<=x['fpr']<=1 and 0<=x['recall']<=1
          print('Validated all class mixing control outputs')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-mixing-training-only-evidence
          path: results/class_mixing_control.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish measured research evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/class_mixing_control.json
          git commit -m "results: publish executed class-mixing control [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
