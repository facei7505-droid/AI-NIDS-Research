name: Observable label-blind donor control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/observable-donor-control.yml'
permissions:
  contents: write
concurrency:
  group: observable-donor-control
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test all experimental code
        run: python -m pytest -q
      - name: Download pinned verified research dataset
        run: python src/download_data.py
      - name: Execute label-blind donor study on TRAINING split ONLY
        run: |
          python src/observable_donor_control.py \
            --train data/UNSW_NB15_training-set.csv \
            --output results/observable_donor_control.json
      - name: Verify research output integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("results/observable_donor_control.json").read_text())
          assert d["status"]=="TRAINING_ONLY_POST_HOC_OBSERVABLE_DONOR_CONTROL"
          assert d["train_sha256"]=="bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa"
          assert len(d["rows"])==3*3*2*3, len(d["rows"])
          assert set(d["policies"])=={"global","observable_strata","same_class_oracle"}
          assert len({(r["split_seed"],r["donor_seed"],r["model"],r["policy"]) for r in d["rows"]})==len(d["rows"])
          for r in d["rows"]:
              assert r["validation_rows"]>0
              assert 0<=r["joint_fpr"]<=1 and 0<=r["joint_recall"]<=1
              assert all(0<=value<=1 for value in r["joint_group_exchange_rate"].values())
          print("Validated all 54 combinations")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-blind-observable-control
          path: results/observable_donor_control.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish executed evidence
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/observable_donor_control.json
          git commit -m "results: publish executed observable donor sensitivity [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
