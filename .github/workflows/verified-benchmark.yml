name: Verified UNSW-NB15 Full Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verified-benchmark.yml'
concurrency:
  group: unsw-full-benchmark
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip freeze > environment-freeze.txt
          mkdir -p results
          cp environment-freeze.txt results/environment-freeze.txt
      - name: Run automated validation
        run: python -m pytest -q
      - name: Download and verify dataset checksums
        run: python src/download_data.py
      - name: Confirm official row counts and cross-split audit
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for split, expected in [('training',175341),('testing',82332)]:
              path = Path('data') / f'UNSW_NB15_{split}-set.csv'
              df = pd.read_csv(path)
              assert len(df) == expected, (split, len(df), expected)
              print(split, len(df))
          PY
          python src/data_audit.py --train data/UNSW_NB15_training-set.csv --test data/UNSW_NB15_testing-set.csv --output results/data_audit.json
      - name: Full baseline experiment
        run: python src/run_experiments.py --cv --output results
      - name: Robustness experiment
        run: python src/run_robustness.py --output results/robustness.json
      - name: Summarize results
        run: |
          python - <<'PY'
          import json, pathlib, pandas as pd
          metrics = pd.read_csv('results/metrics_FULL_BENCHMARK.csv')
          out=['# Executed benchmark (see artifacts)', '', '## Binary classification']
          out += ['```', metrics.to_string(index=False), '```']
          record=json.loads(pathlib.Path('results/robustness.json').read_text())
          out += ['', f"Stress-test rows: {len(record['results'])}",
                  'Synthetic stress tests cannot verify performance on new real attacks.',
                  'See data_audit.json for cross-split overlap and conflicting-label warnings.']
          pathlib.Path('results/SUMMARY.md').write_text('\n'.join(out)+'\n')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unsw-nb15-research-evidence
          path: |
            results/
            environment-freeze.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Validate completed results before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          x=pd.read_csv('results/metrics_FULL_BENCHMARK.csv')
          meta=json.loads(Path('results/metadata_FULL_BENCHMARK.json').read_text())
          robustness=json.loads(Path('results/robustness.json').read_text())
          assert len(x)==3, f"Expected 3 baselines, got {len(x)}"
          assert (x['test_rows']==82332).all()
          assert (x['train_rows']==175341).all()
          assert ((x[['f1','precision','recall','balanced_accuracy','average_precision']]>=0)&(x[['f1','precision','recall','balanced_accuracy','average_precision']]<=1)).all().all()
          assert (x[['tn','fp','fn','tp']].sum(axis=1)==82332).all()
          assert meta['train_sha256']=='bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa'
          assert meta['test_sha256']=='734fe6642edf758f7c94d7d9149426b49d202fe8e7bf0bef47392489c3c0a559'
          assert len(robustness['results'])>3
          assert len(robustness['features'])>0
          print('All minimum evidence checks passed')
          PY
      - name: Publish real outputs to results/ on main
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/metrics_FULL_BENCHMARK.csv results/metadata_FULL_BENCHMARK.json results/train_cv_FULL_BENCHMARK.csv results/robustness.json results/data_audit.json results/environment-freeze.txt results/SUMMARY.md
          git commit -m "results: publish verified executed UNSW-NB15 benchmark [skip ci]"
          git push origin HEAD:main
