name: Training-fitted label-blind donor control

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/train-fitted-donor-control.yml'

permissions:
  contents: write

concurrency:
  group: training-fitted-donor-control
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research environment
        run: python -m pip install -r requirements.txt
      - name: Run all unit and published-evidence tests
        run: python -m pytest -q
      - name: Verify pinned input files
        run: python src/download_data.py
      - name: Execute training-fitted donor experiment
        run: python src/train_fitted_donor_control.py --train data/UNSW_NB15_training-set.csv --output results/train_fitted_donor_control.json
      - name: Compare matched frozen and transductive boundaries
        run: python src/compare_matching_boundaries.py --old results/observable_donor_control.json --frozen results/train_fitted_donor_control.json --json results/donor_quantile_comparison.json --report results/DONOR_QUANTILE_COMPARISON.md
      - name: Validate all model/split/policy conditions and frozen boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/train_fitted_donor_control.json').read_text())
          c=json.loads(Path('results/donor_quantile_comparison.json').read_text())
          assert d['train_sha256']=='bec7dd5ec88dc2a0ccc7a07879d338395ed7421750f675fd0339e07dfe0648fa'
          assert d['status']=='POST_HOC_TRAIN_FITTED_OBSERVABLE_STRATA'
          assert len(d['rows'])==54
          assert len(d['frozen_strata_parameters'])==3
          assert len({(x['split_seed'],x['donor_seed'],x['model'],x['policy']) for x in d['rows']})==54
          assert c['n_paired_conditions']==54
          assert len(c['summary'])==6
          assert c['train_sha256']==d['train_sha256']
          for s in d['frozen_strata_parameters']:
              assert s['strata_parameters_fit_on']=='training_rows_only'
              assert s['fit_rows']+s['validation_rows']==175341
              assert set(s['strata']['columns'])=={'dur','sbytes'}
          for r in d['rows']:
              assert 0<=r['joint_fpr']<=1 and 0<=r['joint_recall']<=1
              assert 0<=r['exchange_protocol']<=1 and 0<=r['exchange_context']<=1
          print('Verified all frozen-strata paired scientific evidence')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: train-fitted-donor-evidence
          path: |
            results/train_fitted_donor_control.json
            results/donor_quantile_comparison.json
            results/DONOR_QUANTILE_COMPARISON.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish executed outputs only when tests succeed
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/train_fitted_donor_control.json results/donor_quantile_comparison.json results/DONOR_QUANTILE_COMPARISON.md
          git commit -m "results: publish executed training-fitted donor comparison [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
